<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>RGBL Eğri Editörü + Simülasyon Odası</title>
<style>
*, *::before, *::after { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #080c18;
    color: #c8d8f0;
    font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
    font-size: 13px;
}

#app {
    display: flex;
    width: 100vw;
    height: 100vh;
}

#editor-panel {
    flex: 0 0 46%;
    display: flex;
    flex-direction: column;
    padding: 16px 12px 12px 16px;
    border-right: 1px solid rgba(255,255,255,0.07);
    gap: 8px;
    min-width: 0;
}

.panel-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #3a5a88;
}

#channel-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.ch-btn {
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #0e1628;
    cursor: pointer;
    font-size: 12px;
    font-weight: 800;
    transition: 0.15s;
    outline: none;
}
.ch-btn:hover { border-color: rgba(255,255,255,0.25); }
.ch-btn.active { box-shadow: 0 0 9px currentColor; border-color: currentColor; background: #131c2f; }
.ch-btn[data-ch="R"]  { color: #f87171; }
.ch-btn[data-ch="G"]  { color: #4ade80; }
.ch-btn[data-ch="B"]  { color: #60a5fa; }
.ch-btn[data-ch="L"]  { color: #e2e8f0; }
.ch-btn[data-ch="T"]  { color: #fbbf24; }

#d3-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
}
#d3-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }

.value-marker {
    position: fixed;
    background: #0f172a;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    font-family: monospace;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
    z-index: 1000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
#x-value-marker {
    border-left: 2px solid #fbbf24;
    color: #fbbf24;
    transform: translateX(-50%);
}
#y-value-marker {
    border-bottom: 2px solid #94a3b8;
    color: #94a3b8;
    transform: translateY(-50%);
}

.hint {
    font-size: 10px;
    color: #3a5a88;
    text-align: center;
}

#value-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}
.val-chip {
    flex: 1;
    min-width: 55px;
    background: #0e1628;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 5px 6px;
    text-align: center;
}
.val-chip .lbl { font-size: 8px; color: #3a5a88; text-transform: uppercase; }
.val-chip .num { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }

#sim-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 10px;
    min-width: 0;
}

#sim-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 640px;
}

#mode-bar {
    display: flex;
    gap: 4px;
}
#mode-bar label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-size: 11px;
    background: #0e1628;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.07);
}
#mode-bar label:has(input:checked) {
    color: #c8d8f0;
    background: #131c2f;
    border-color: rgba(255,255,255,0.2);
}
#mode-bar input[type="radio"] { display: none; }

.simulation-container {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 900 / 560;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.65);
    background: #03050a;
    position: relative;
}
.simulation-container svg { width: 100%; height: 100%; display: block; overflow: hidden;}

.screen-slider {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 14px 6px;
    border: 1px solid rgba(255,255,255,0.2);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
/* .screen-slider input {
    writing-mode: bt-lr;
    -webkit-appearance: slider-vertical;
    width: 28px;
    height: 140px;
    background: #334155;
    border-radius: 14px;
} */
.screen-slider input {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 28px;
    height: 140px;
    background: #334155;
    border-radius: 14px;
    cursor: pointer;
}
.screen-slider .slider-value {
    font-size: 11px;
    font-weight: bold;
    color: #e2e8f0;
}
.screen-slider .slider-label {
    font-size: 8px;
    color: #94a3b8;
}

#info-panel {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 640px;
}
.info-item {
    flex: 1;
    background: #0e1628;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    text-align: center;
}
.info-item span { font-weight: 700; color: #c8d8f0; }

#status-bar {
    font-size: 12px;
    text-align: center;
    padding: 7px 20px;
    background: #0e1628;
    border-radius: 12px;
    width: 100%;
    max-width: 640px;
}
#sim-status { color: #c8d8f0; font-weight: 600; }
.calc-seg-btn {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 8px;
    background: #0e1628;
    color: #3a5a88;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.07);
    transition: 0.15s;
    outline: none;
}
.calc-seg-btn.active {
    color: #fbbf24;
    background: #131c2f;
    border-color: rgba(251,191,36,0.35);
    box-shadow: 0 0 6px rgba(251,191,36,0.25);
}
</style>
</head>
<body>

<div id="app">

  <div id="editor-panel">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="panel-title">RGBL Eğri Editörü</span>
      <div style="display:flex;gap:6px;">
        <div id="calc-mode-group" style="display:flex;gap:2px;">
          <button class="calc-seg-btn" id="calc-btn-absolute">⚡ Mutlak</button>
          <button class="calc-seg-btn" id="calc-btn-ratio">Oran</button>
        </div>
        <button id="export-btn" style="font-size:10px;padding:3px 10px;border-radius:8px;background:#0e1628;color:#4ade80;cursor:pointer;">💾 Kaydet</button>
        <button id="pick-file-btn" style="font-size:10px;padding:3px 10px;border-radius:8px;background:#0e1628;color:#60a5fa;cursor:pointer;" title="Kayıt konumunu değiştir / Yedek al">📁</button>
        <button id="reset-btn" style="font-size:10px;padding:3px 10px;border-radius:8px;background:#0e1628;color:#3a5a88;cursor:pointer;">↺ Sıfırla</button>
      </div>
    </div>
    <div style="text-align:right;min-height:15px;font-size:10px;line-height:15px;">
      <span id="save-status" style="color:#4ade80;opacity:0;transition:opacity 0.4s;"></span>
    </div>

    <div id="channel-bar">
      <span style="font-size:10px;color:#3a5a88;">Aktif:</span>
      <button class="ch-btn" data-ch="R">R</button>
      <button class="ch-btn" data-ch="G">G</button>
      <button class="ch-btn" data-ch="B">B</button>
      <button class="ch-btn active" data-ch="L">L</button>
      <button class="ch-btn" data-ch="T">T</button>
    </div>

    <div id="d3-wrap">
      <div id="x-value-marker" class="value-marker" style="display: none;">0%</div>
      <div id="y-value-marker" class="value-marker" style="display: none;">0%</div>
    </div>

    <div id="value-bar">
      <div class="val-chip"><div class="lbl" id="lbl-xpos">Ortam</div><div class="num" id="disp-amb" style="color:#94a3b8">—</div></div>
      <div class="val-chip"><div class="lbl">T(x)</div><div class="num" id="disp-t" style="color:#fbbf24">—</div></div>
      <div class="val-chip"><div class="lbl">LT(x)</div><div class="num" id="disp-lt" style="color:#c084fc">—</div></div>
      <div class="val-chip"><div class="lbl">R</div><div class="num" id="disp-r" style="color:#f87171">—</div></div>
      <div class="val-chip"><div class="lbl">G</div><div class="num" id="disp-g" style="color:#4ade80">—</div></div>
      <div class="val-chip"><div class="lbl">B</div><div class="num" id="disp-b" style="color:#60a5fa">—</div></div>
      <div class="val-chip"><div class="lbl">L</div><div class="num" id="disp-l" style="color:#e2e8f0">—</div></div>
    </div>

    <div class="hint">Kanal seç → Eğriye tıkla / Boşluğa tıkla (düğüm ekle) | Düğüm sürükle | Sağ tık sil</div>
  </div>

  <div id="sim-panel">
    <div id="sim-header">
      <span class="panel-title">Simülasyon Odası</span>
      <div id="mode-bar">
        <!-- Eski isim: Sensör Modu -->
        <label><input type="radio" name="simMode" value="sensor"> 🌙 Işık Yoğunluğu Modu</label>
        <!-- Eski isim: 24 Saat Döngüsü -->
        <label><input type="radio" name="simMode" value="time" checked> 🌞 Gün Döngüsü Modu</label>
      </div>
    </div>

    <div class="simulation-container">
      <svg id="sim-svg" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffdd99" stop-opacity="0.9"/>
            <stop offset="80%" stop-color="#ffaa55" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#ff8844" stop-opacity="0"/>
          </radialGradient>
          <filter id="glowBlur"><feGaussianBlur stdDeviation="38"/></filter>
        </defs>

        <path fill="#eef2f7" fill-rule="evenodd" d="M0,0 L900,0 L900,560 L0,560 Z M70,70 L330,70 L330,390 L70,390 Z"/>
        <rect id="simSky" x="70" y="70" width="260" height="320" rx="8" fill="#0b1021"/>
        <g id="starsGroup"></g>
        <circle id="sunHalo" cx="200" cy="200" r="52" opacity="0" fill="url(#sunGrad)" style="mix-blend-mode:screen;"/>
        <circle id="moonHalo" cx="200" cy="200" r="46" opacity="0" fill="rgba(220,240,255,0.8)" style="mix-blend-mode:soft-light;"/>
        <circle id="celestial" cx="200" cy="200" r="30" fill="#ccd9ff"/>

        <rect fill="#4a5b6e" stroke="#1e2a36" stroke-width="1.2" x="60" y="60" width="280" height="12" rx="4"/>
        <rect fill="#4a5b6e" stroke="#1e2a36" stroke-width="1.2" x="60" y="390" width="280" height="12" rx="4"/>
        <rect fill="#4a5b6e" stroke="#1e2a36" stroke-width="1.2" x="60" y="60" width="12" height="342" rx="3"/>
        <rect fill="#4a5b6e" stroke="#1e2a36" stroke-width="1.2" x="328" y="60" width="12" height="342" rx="3"/>
        <rect fill="#4a5b6e" stroke="#1e2a36" stroke-width="1.2" x="188" y="60" width="12" height="342" rx="3"/>

        <rect fill="#7f5e3b" x="0" y="460" width="900" height="100" rx="8"/>
        <path fill="#c97e3a" d="M780,460 L820,460 L810,410 L790,410 Z"/>
        <circle fill="#4caf50" cx="800" cy="395" r="18"/>
        <circle fill="#4caf50" cx="782" cy="375" r="14"/>
        <circle fill="#4caf50" cx="818" cy="380" r="15"/>

        <path fill="#3a4a5c" d="M530,350 L570,350 L580,460 L520,460 Z"/>
        <rect fill="#3a4a5c" x="470" y="450" width="160" height="12" rx="5"/>
        <rect fill="#11161f" x="380" y="190" width="340" height="210" rx="12"/>
        <rect id="monitorScreen" x="392" y="202" width="316" height="186" rx="6" fill="rgb(30,30,60)"/>
        
        <text id="screenLtValue" x="550" y="295" text-anchor="middle" dominant-baseline="middle"
              font-family="monospace" font-size="42" font-weight="bold"
              fill="rgba(255,255,255,0.85)" style="pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,0.5);">--%</text>

        <path id="roomOverlay" fill="#000" fill-rule="evenodd" opacity="0.75" pointer-events="none"
              d="M0,0 L900,0 L900,560 L0,560 Z M70,70 L330,70 L330,390 L70,390 Z"/>
        <!-- <ellipse id="screenGlow" cx="550" cy="295" rx="210" ry="140" fill="rgb(30,30,60)" opacity="0.15" style="filter:url(#glowBlur);pointer-events:none;"/> -->
        <ellipse id="screenGlow" cx="550" cy="295" rx="210" ry="140"  fill="rgb(30,30,60)" opacity="0.15" style="filter:blur(38px);pointer-events:none;overflow:hidden;"/>
      </svg>
      
      <div class="screen-slider">
        <!-- <input type="range" id="passiveLSlider" min="0" max="100" value="20" orient="vertical"> -->
        <input type="range" id="passiveLSlider" min="0" max="100" value="20">
        <span class="slider-value" id="passiveLValue">20</span>
        <span class="slider-label">MIN L</span>
      </div>
      
    </div>

    <div id="info-panel">
      <!-- sağ panel Ortam ve RGBL değeri -->
      <div class="info-item">🔅 Ortam: <span id="valX">—</span></div>
      <div class="info-item">🖥️ RGBL: <span id="valY">—</span></div>
    </div>
    <div id="status-bar">✨ Durum: <span id="sim-status">—</span></div>
  </div>
</div>

<script src="d3.js"></script>
<script src="luminosity.js"></script>
<script src="sim-engine.js"></script>
<script src="d3-editor.js"></script>
<script src="diagnostic.js"></script>


</body>
</html>
