<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Matematiksel Gece/Gündüz Simülasyonu | RGBL Güncellemesi</title>
    <style>
        * { user-select: none; }

        :root {
            --sky-color: #0b1021;
            --sun-color: #ffcc00;
            --moon-color: #f0f0f0;
            --celestial-y: 200px;
            --celestial-radius: 30;
            --room-brightness: 0.3;
            --screen-color: rgb(255, 255, 255);
            --screen-glow-opacity: 0.2;
            --star-opacity: 0;
            --sun-glow-opacity: 0;
            --moon-glow-opacity: 0;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #101624 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #eef4ff;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            flex-direction: column;
        }

        .simulation-container {
            width: 900px;
            height: 560px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            background-color: #03050a;
            transition: all 0.2s;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        .sky { fill: var(--sky-color); transition: fill 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        .celestial-body {
            fill: var(--sun-color); r: var(--celestial-radius);
            transition: fill 0.2s ease, r 0.2s cubic-bezier(0.34, 1.2, 0.64, 1), cy 0.3s ease-out, cx 0.3s ease-out;
        }
        .star { fill: #fff9e0; opacity: var(--star-opacity); transition: opacity 0.4s ease-out; filter: blur(0.5px); }
        .sun-halo {
            fill: url(#sunGrad); opacity: var(--sun-glow-opacity);
            transition: opacity 0.25s ease, cy 0.3s ease-out, cx 0.3s ease-out;
            filter: blur(14px); mix-blend-mode: screen;
        }
        .moon-halo {
            fill: rgba(220, 240, 255, 0.8); opacity: var(--moon-glow-opacity);
            transition: opacity 0.25s ease, cy 0.3s ease-out, cx 0.3s ease-out;
            filter: blur(18px); mix-blend-mode: soft-light;
        }

        .window-frame { fill: #4a5b6e; stroke: #1e2a36; stroke-width: 1.2; }
        .wall { fill: #eef2f7; fill-rule: evenodd; }
        .desk { fill: #7f5e3b; }
        .plant-pot { fill: #c97e3a; }
        .plant-leaf { fill: #4caf50; }
        .monitor-stand { fill: #3a4a5c; }
        .monitor-bezel { fill: #11161f; }
        .monitor-screen { fill: var(--screen-color); transition: fill 0.1s; }
        .screen-glow {
            fill: var(--screen-color); opacity: var(--screen-glow-opacity);
            filter: blur(38px); transition: all 0.12s; pointer-events: none;
        }
        .room-shadow-overlay {
            fill: #000000; opacity: calc(1 - var(--room-brightness));
            transition: opacity 0.25s ease; pointer-events: none; fill-rule: evenodd;
        }

        .dashboard {
            margin-top: 24px; background: rgba(20, 25, 40, 0.85); backdrop-filter: blur(8px);
            padding: 16px 28px; border-radius: 24px; width: 820px;
            border: 1px solid rgba(255,255,240,0.15); box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .toggle-group { display: flex; justify-content: center; gap: 35px; margin-bottom: 16px; }
        .toggle-group label {
            cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500;
            background: #1e243b; padding: 6px 18px; border-radius: 40px; transition: all 0.2s;
        }
        .toggle-group input:checked + label, .toggle-group label:has(input:checked) {
            background: #3c4b6e; box-shadow: 0 0 8px #5f7fbf;
        }
        .info-panel { display: flex; justify-content: space-between; gap: 15px; font-size: 0.95rem; }
        .info-item {
            background: #0c1122cc; padding: 8px 16px; border-radius: 32px;
            backdrop-filter: blur(2px); flex: 1; text-align: center;
        }
        .info-item span { font-weight: bold; color: #ffde9c; }
        .status-row { margin-top: 12px; display: block; border-radius: 12px; }
    </style>
</head>
<body>

<div class="simulation-container">
    <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffdd99" stop-opacity="0.9"/>
                <stop offset="80%" stop-color="#ffaa55" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#ff8844" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <path class="wall" d="M0,0 L900,0 L900,560 L0,560 Z M70,70 L330,70 L330,390 L70,390 Z" />
        <rect class="sky" x="70" y="70" width="260" height="320" rx="8" />
        
        <g id="starsGroup"></g>
        
        <circle class="sun-halo" cx="200" cy="200" r="52" />
        <circle class="moon-halo" cx="200" cy="200" r="46" />
        <circle class="celestial-body" cx="200" cy="200" r="30" />
        
        <rect class="window-frame" x="60" y="60" width="280" height="12" rx="4" />
        <rect class="window-frame" x="60" y="390" width="280" height="12" rx="4" />
        <rect class="window-frame" x="60" y="60" width="12" height="342" rx="3" />
        <rect class="window-frame" x="328" y="60" width="12" height="342" rx="3" />
        <rect class="window-frame" x="188" y="60" width="12" height="342" rx="3" />
        
        <rect class="desk" x="0" y="460" width="900" height="100" rx="8" />
        <path class="plant-pot" d="M780,460 L820,460 L810,410 L790,410 Z" />
        <circle class="plant-leaf" cx="800" cy="395" r="18" />
        <circle class="plant-leaf" cx="782" cy="375" r="14" />
        <circle class="plant-leaf" cx="818" cy="380" r="15" />
        
        <path class="monitor-stand" d="M530,350 L570,350 L580,460 L520,460 Z" />
        <rect class="monitor-stand" x="470" y="450" width="160" height="12" rx="5" />
        <rect class="monitor-bezel" x="380" y="190" width="340" height="210" rx="12" />
        <rect class="monitor-screen" x="392" y="202" width="316" height="186" rx="6" />
        
        <path class="room-shadow-overlay" d="M0,0 L900,0 L900,560 L0,560 Z M70,70 L330,70 L330,390 L70,390 Z" />
        <ellipse class="screen-glow" cx="550" cy="295" rx="210" ry="140" />
    </svg>
</div>

<div class="dashboard">
    <div class="toggle-group">
        <label>
            <input type="radio" name="simMode" value="time" checked onchange="changeMode()"> 
            🌞 24 Saat Döngüsü (X: Ortam Işığı / Y: RGBL)
        </label>
        <label>
            <input type="radio" name="simMode" value="sensor" onchange="changeMode()"> 
            🌙 Sensör Modu (X: Ortam Işığı / Y: RGBL)
        </label>
    </div>
    <div class="info-panel">
        <div class="info-item">🔅 Ortam Işığı: <span id="valX">0</span></div>
        <div class="info-item">🖥️ Ekran RGBL: <span id="valY">R:0 G:0 B:0 L:0</span></div>
    </div>
    <div class="info-item status-row">✨ Durum: <span id="valTime">Gece</span></div>
</div>

<script>
    const root = document.documentElement;
    const elX = document.getElementById('valX');
    const elTime = document.getElementById('valTime');
    const elY = document.getElementById('valY');
    
    let currentX_raw = 128; let currentY_raw = 150; let currentMode = "time";
    
    const celestial = document.querySelector('.celestial-body');
    const sunHalo = document.querySelector('.sun-halo');
    const moonHalo = document.querySelector('.moon-halo');
    const starsGroup = document.getElementById('starsGroup');
    
    function generateStars() {
        starsGroup.innerHTML = '';
        const skyX = 70, skyY = 70, skyW = 260, skyH = 320;
        for (let i = 0; i < 160; i++) {
            const star = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            star.setAttribute("cx", skyX + Math.random() * skyW);
            star.setAttribute("cy", skyY + Math.random() * skyH);
            star.setAttribute("r", 1 + Math.random() * 2.2);
            star.setAttribute("class", "star");
            star.style.opacity = "0";
            starsGroup.appendChild(star);
        }
    }
    generateStars();
    
    function smoothStep(t) { return t * t * (3 - 2 * t); }
    
    function getSkyColorByTime(t) {
        const night1 = { r: 2, g: 6, b: 23 };
        const predawn = { r: 15, g: 30, b: 60 }; 
        const morning = { r: 80, g: 140, b: 210 }; 
        const day = { r: 110, g: 195, b: 232 }; 
        const dusk = { r: 180, g: 95, b: 43 }; 
        const night2 = { r: 8, g: 12, b: 38 };

        let r, g, b;
        if (t < 0.2) { 
            let p = smoothStep(t / 0.2); 
            r = night1.r + (predawn.r - night1.r) * p;
            g = night1.g + (predawn.g - night1.g) * p;
            b = night1.b + (predawn.b - night1.b) * p;
        } else if (t < 0.35) { 
            let p = smoothStep((t - 0.2) / 0.15); 
            r = predawn.r + (morning.r - predawn.r) * p;
            g = predawn.g + (morning.g - predawn.g) * p;
            b = predawn.b + (morning.b - predawn.b) * p;
        } else if (t < 0.65) { 
            let p = (t - 0.35) / 0.3; 
            let intensity = 1 - Math.abs(p - 0.5) * 0.3;
            r = Math.min(245, day.r * (0.9 + intensity * 0.2));
            g = Math.min(235, day.g * (0.9 + intensity * 0.2));
            b = Math.min(250, day.b * (1 + intensity * 0.1));
        } else if (t < 0.8) { 
            let p = smoothStep((t - 0.65) / 0.15); 
            r = day.r + (dusk.r - day.r) * p;
            g = day.g + (dusk.g - day.g) * p;
            b = day.b + (dusk.b - day.b) * p;
        } else { 
            let p = smoothStep((t - 0.8) / 0.2); 
            r = dusk.r + (night2.r - dusk.r) * p;
            g = dusk.g + (night2.g - dusk.g) * p;
            b = dusk.b + (night2.b - dusk.b) * p;
        }
        return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
    }
    
    function getSkyColorBySensor(ratio) {
        const dark = { r: 11, g: 20, b: 40 };
        const bright = { r: 192, g: 224, b: 255 };
        let t = Math.pow(Math.sin(ratio * Math.PI / 2), 1.2);
        return `rgb(${Math.floor(dark.r + (bright.r - dark.r) * t)}, ${Math.floor(dark.g + (bright.g - dark.g) * t)}, ${Math.floor(dark.b + (bright.b - dark.b) * t)})`;
    }
    
    function getCelestialY(t) { return 360 - 265 * Math.sin(Math.PI * t); }
    function getCelestialYSensor(ratio) { return 360 - 265 * ratio; }
    function getRoomBrightnessByTime(t) { return 0.12 + Math.sin(Math.PI * t) * 0.78; }
    function getRoomBrightnessBySensor(ratio) { return 0.1 + Math.pow(ratio, 1.2) * 0.85; }
    
    function updateEnvironment(xRaw, yRaw) {
        const mode = document.querySelector('input[name="simMode"]:checked').value;
        currentMode = mode;
        
        // 0-255'ten 0-100'e dönüştürme
        let x100 = Math.round((xRaw / 255) * 100);
        let y100 = Math.round((yRaw / 255) * 100);
        
        elX.innerText = x100;
        
        // RGBL Hesaplama (L = Luminance/Parlaklık)
        // Şimdilik RGB değerlerini parlaklığa (L) bağlı simüle ediyoruz
        let R = Math.round(y100 * 1.0);
        let G = Math.round(y100 * 0.92);
        let B = Math.round(y100 * 1.05);
        let L = y100;
        elY.innerText = `R:${R} G:${G} B:${B} L:${L}`;
        
        let skyColor, celestialColor, roomBright, celestialY, celestialX, t_param, sensorRatio;
        let timeLabel = "";
        
        if (mode === 'time') {
            t_param = xRaw / 255;
            const hourVal = t_param * 24;
            let timePrefix = `${Math.floor(hourVal).toString().padStart(2,'0')}:${Math.floor((hourVal % 1) * 60).toString().padStart(2,'0')} - `;
            
            if (hourVal >= 0 && hourVal < 4) timeLabel = timePrefix + "🌌 Gece Yarısı";
            else if (hourVal >= 4 && hourVal < 6) timeLabel = timePrefix + "🌠 Sabaha Karşı";
            else if (hourVal >= 6 && hourVal < 9) timeLabel = timePrefix + "🌄 Sabah";
            else if (hourVal >= 9 && hourVal < 11.5) timeLabel = timePrefix + "🌤️ Kuşluk";
            else if (hourVal >= 11.5 && hourVal < 13.5) timeLabel = timePrefix + "🔆 Tam Öğlen";
            else if (hourVal >= 13.5 && hourVal < 16.5) timeLabel = timePrefix + "☀️ Öğleden Sonra";
            else if (hourVal >= 16.5 && hourVal < 19) timeLabel = timePrefix + "🌅 Akşamüstü";
            else if (hourVal >= 19 && hourVal < 21) timeLabel = timePrefix + "🌆 Gün Batımı";
            else timeLabel = timePrefix + "🌙 Gece";

            skyColor = getSkyColorByTime(t_param);
            roomBright = getRoomBrightnessByTime(t_param);
            celestialY = getCelestialY(t_param);
            celestialX = 200 - 110 * Math.cos(Math.PI * t_param);

            if (Math.sin(Math.PI * t_param) > 0.15) {
                if(t_param < 0.5) {
                    celestialColor = `rgb(255, 250, 230)`; 
                } else {
                    let eveningRatio = smoothStep((t_param - 0.5) / 0.5);
                    celestialColor = `rgb(255, ${230 - 60 * eveningRatio}, ${150 - 50 * eveningRatio})`;
                }
            } else {
                celestialColor = `rgb(230, 240, 255)`; 
            }
            sensorRatio = t_param;
        } else {
            sensorRatio = xRaw / 255;
            if (sensorRatio > 0.9) timeLabel = "🔆 Çok Aydınlık";
            else if (sensorRatio > 0.7) timeLabel = "☀️ Aydınlık";
            else if (sensorRatio > 0.5) timeLabel = "🌤️ Normal";
            else if (sensorRatio > 0.3) timeLabel = "🌅 Loş";
            else if (sensorRatio > 0.1) timeLabel = "🌆 Alacakaranlık";
            else timeLabel = "🌙 Karanlık";

            skyColor = getSkyColorBySensor(sensorRatio);
            roomBright = getRoomBrightnessBySensor(sensorRatio);
            celestialY = getCelestialYSensor(sensorRatio);
            celestialX = 200 - 110 * Math.cos(Math.PI * sensorRatio);

            if (sensorRatio > 0.45) {
                let orangeRatio = Math.min(1, Math.max(0, (sensorRatio - 0.45) / 0.55));
                celestialColor = `rgb(255, ${170 + orangeRatio * 85}, ${80 + orangeRatio * 120})`;
            } else {
                celestialColor = "#ccd9ff";
            }
            t_param = sensorRatio;
        }
        
        let isDayMode = mode === 'time' ? (Math.sin(Math.PI * t_param) > 0.1) : (sensorRatio > 0.4);
        
        // YILDIZLARIN ÇIKIŞI: Biraz daha erken (çarpan 1.8 -> 1.4 yapıldı, güç düşürüldü)
        let nightFactor = 0;
        if (mode === 'time') {
            nightFactor = Math.pow(Math.max(0, 1 - Math.sin(Math.PI * t_param) * 1.4), 1.5);
        } else {
            nightFactor = Math.pow(Math.max(0, 1 - sensorRatio * 1.3), 1.5);
        }
        
        let starOpacity = Math.min(0.96, nightFactor * 0.9);
        root.style.setProperty('--star-opacity', starOpacity);
        
        if (celestial) {
            celestial.setAttribute('cx', celestialX); celestial.setAttribute('cy', celestialY);
            celestial.setAttribute('r', isDayMode ? 40 : 30);
            celestial.style.fill = celestialColor;
        }
        if (sunHalo) {
            sunHalo.setAttribute('cx', celestialX); sunHalo.setAttribute('cy', celestialY);
            root.style.setProperty('--sun-glow-opacity', isDayMode ? 0.6 : 0);
        }
        if (moonHalo) {
            moonHalo.setAttribute('cx', celestialX); moonHalo.setAttribute('cy', celestialY);
            root.style.setProperty('--moon-glow-opacity', !isDayMode ? 0.6 : 0);
        }
        
        root.style.setProperty('--sky-color', skyColor);
        root.style.setProperty('--room-brightness', roomBright);
        
        // Ekran görselini güncelle (Yine 255'e göre çünkü CSS rgb bekler)
        root.style.setProperty('--screen-color', `rgb(${yRaw}, ${Math.floor(yRaw * 0.92)}, ${Math.floor(yRaw * 1.05)})`);
        root.style.setProperty('--screen-glow-opacity', (yRaw / 255) * 0.65);
        elTime.innerText = timeLabel;
    }
    
    document.addEventListener('mousemove', (e) => {
        let newX = Math.floor((e.clientX / window.innerWidth) * 255);
        let newY = Math.floor((1 - (e.clientY / window.innerHeight)) * 255);
        currentX_raw = Math.min(255, Math.max(0, newX)); 
        currentY_raw = Math.min(255, Math.max(0, newY));
        updateEnvironment(currentX_raw, currentY_raw);
    });
    
    function changeMode() { updateEnvironment(currentX_raw, currentY_raw); }
    updateEnvironment(128, 150);
    
    setInterval(() => {
        let stars = document.querySelectorAll('.star');
        let currentOpac = parseFloat(getComputedStyle(root).getPropertyValue('--star-opacity'));
        if (currentOpac > 0.05) {
            stars.forEach(star => { star.style.opacity = Math.min(0.95, currentOpac * (0.7 + Math.random() * 0.6)); });
        } else {
            stars.forEach(star => star.style.opacity = "0");
        }
    }, 700);
</script>
</body>
</html>
